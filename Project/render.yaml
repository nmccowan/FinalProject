databases:
  - name: library-db
    plan: free
    databaseName: library
    user: library
    ipAllowList: []          # private network only; the web service connects internally

services:
  - type: web
    name: personal-library
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString